<!doctype html>
<!-- Modello dell'icona della PWA. Rigenera i PNG con: node tools/make-icons.mjs -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  .icon {
    width: 100vw; height: 100vh;
    background: #0F0D0B;
    background-image: radial-gradient(circle at 25% 15%, rgba(196,69,94,0.22) 0%, transparent 55%),
                      radial-gradient(circle at 80% 90%, rgba(226,191,122,0.12) 0%, transparent 50%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 58vw; line-height: 1; color: #C4455E; letter-spacing: -0.02em;
  }
  .icon span { color: #E2BF7A; }
</style>
</head>
<body><div class="icon"><div style="transform: translate(4%, -5%)">C<span>.</span></div></div></body>
</html>
